name: Build and Release
# Builds Windows artifacts and publishes a GitHub release for version tags.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore client
        run: dotnet restore TcNo-Acc-Switcher-Client/TcNo-Acc-Switcher-Client.csproj

      - name: Publish client
        run: dotnet publish TcNo-Acc-Switcher-Client/TcNo-Acc-Switcher-Client.csproj --configuration Release -p:Platform=x64 -r win-x64 --self-contained false -o publish/client --no-restore

      - name: Publish runas helper
        run: dotnet publish runas/runas.csproj --configuration Release -p:Platform=x64 -r win-x64 --self-contained false -o publish/runas

      - name: Copy runas helper
        shell: pwsh
        run: |
          $clientOut = "publish/client"
          $runas = Get-ChildItem -Path "publish/runas" -Filter "runas.exe" -Recurse | Select-Object -First 1
          if ($null -eq $runas) { throw "runas.exe was not built" }
          Copy-Item -LiteralPath $runas.FullName -Destination $clientOut -Force

      - name: Package release
        shell: pwsh
        run: |
          $clientOut = "publish/client"
          $zip = "TcNo-Acc-Switcher-Isolated-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$clientOut/*" -DestinationPath $zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: TcNo-Acc-Switcher-Isolated-${{ github.ref_name }}.zip
          generate_release_notes: true
